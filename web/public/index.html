
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">
            <div class="logo">GP</div>

            <h1>Gestión de Productos</h1>
            <p class="subtitle">Iniciá sesión para continuar</p>

            <form id="loginForm">

    <label for="implementationSelect">Base de datos</label>
    <select id="implementationSelect">
        <option value="memory">Memoria</option>
        <option value="mongodb">MongoDB</option>
    </select>

    <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Ingresá tu usuario"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    required
                >

                <button type="submit" id="loginButton">
                    Iniciar sesión
                </button>

                <p id="message"></p>
            </form>

            <p class="footer">Sistema de administración de productos</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
