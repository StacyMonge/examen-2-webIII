syntax = "proto3";

package products;

service ProductService {
    rpc GetProducts (Empty) returns (ProductList);
    rpc GetProductById (ProductId) returns (Product);
    rpc CreateProduct (Product) returns (Product);
    rpc UpdateProduct (Product) returns (Product);
    rpc DeleteProduct (ProductId) returns (OperationResponse);

    rpc GetProductsByCategory (CategoryFilter) returns (ProductList);
    rpc GetProductSummaries (Empty) returns (ProductSummaryList);
    rpc GetProductDetails (ProductId) returns (ProductDetails);
    rpc GetProductsPaginated (ProductPageRequest) returns (ProductPageResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
}


message Empty {}

message ProductId {
    int32 id = 1;
}

message Product {
    int32 id = 1;
    string name = 2;
    double price = 3;
    int32 categoryId = 4;
    int32 supplierId = 5;
}

message ProductList {
    repeated Product products = 1;
}

message OperationResponse {
    bool success = 1;
    string message = 2;
}

message CategoryFilter {
    int32 categoryId = 1;
}

message ProductSummary {
    string name = 1;
    double price = 2;
}

message ProductSummaryList {
    repeated ProductSummary products = 1;
}

message ProductDetails {
    Product product = 1;
    Category category = 2;
    Supplier supplier = 3;
}

message Category {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message Supplier {
    int32 id = 1;
    string name = 2;
    string country = 3;
}

message ProductPageRequest {
    int32 page = 1;
    int32 pageSize = 2;
    string sortBy = 3;
    string sortOrder = 4;
}

message ProductPageResponse {
    repeated Product products = 1;
    int32 total = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
    string message = 2;
}
